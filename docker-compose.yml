services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "14330:1433"
    healthcheck:
      test:         [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Password123!\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: src/API.Host/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Application: "Server=sqlserver;Database=CatalogueDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;"
    ports:
      - "8080:8080"
